[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocora"
version = "0.1.0"
description = "Residual-only coded curvature experiments on Cloud TPU"
requires-python = ">=3.10"
dependencies = ["jax==0.6.2", "jaxlib==0.6.2", "numpy>=1.26,<3"]

[project.optional-dependencies]
tpu = ["libtpu==0.0.17"]
data = ["datasets>=3,<5", "tiktoken>=0.8", "huggingface-hub>=0.27"]
test = ["pytest>=8"]

[project.scripts]
rocora-train = "rocora.train:entrypoint"
rocora-data = "rocora.prepare:main"
rocora-bench = "rocora.benchmark:main"
rocora-report = "rocora.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
